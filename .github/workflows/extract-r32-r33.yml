name: Extract r32 source for r33

on:
  push:
    branches: [r33-dev]
    paths:
      - '.r33-extract-trigger'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact r32 plugin
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/r33src
          mkdir -p /tmp/r33src
          unzip -q SafeUpdate2026_2026.1-r32.zip -d /tmp/r33src
          python3 -m py_compile /tmp/r33src/SafeUpdate2026/plugin.py
          cp /tmp/r33src/SafeUpdate2026/plugin.py ./plugin_r32_for_r33.py
          sha256sum /tmp/r33src/SafeUpdate2026/plugin.py > plugin_r32_for_r33.sha256
      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: plugin-r32-for-r33
          path: |
            plugin_r32_for_r33.py
            plugin_r32_for_r33.sha256
          if-no-files-found: error
