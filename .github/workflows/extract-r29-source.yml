name: Extract r29 source temporary
on:
  push:
    branches: [main]
    paths: ['.r30-extract-trigger']
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/r29src
          mkdir -p /tmp/r29src
          unzip -q SafeUpdate2026_2026.1-r29.zip -d /tmp/r29src
          mkdir -p .r30-src
          cp /tmp/r29src/SafeUpdate2026/plugin.py .r30-src/plugin_r29.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .r30-src/plugin_r29.py
          git commit -m "Stage r29 source for r30 adaptation"
          git push origin HEAD:main
