name: Build SafeUpdate2026 r27 ZIP

on:
  push:
    branches: [main]
    paths:
      - '.r27-src/TRIGGER'

permissions:
  contents: write

jobs:
  build-r27:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build verified r27 archive
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/r27build
          mkdir -p /tmp/r27build
          cp SafeUpdate2026_2026.1-r26.zip /tmp/r27build/r26.zip
          cd /tmp/r27build
          unzip -q r26.zip

          test "$(sha256sum SafeUpdate2026/background.png | awk '{print $1}')" = "8e950f61654321cc2ed1b366a36aa4b0cafe3a6f47731cb650735e693438749a"
          test "$(sha256sum SafeUpdate2026/background_generic.png | awk '{print $1}')" = "8e950f61654321cc2ed1b366a36aa4b0cafe3a6f47731cb650735e693438749a"
          test "$(sha256sum SafeUpdate2026/background_vu_duo4kse.png | awk '{print $1}')" = "bbc86893002abf155840577d8b02ce907e408436dd6882b43b6c9d6d7c417739"

          python3 - <<'PY'
          import base64, zlib, pathlib
          src = pathlib.Path("$GITHUB_WORKSPACE/.r27-src/plugin.zlib.b64")
          out = pathlib.Path("SafeUpdate2026/plugin.py")
          out.write_bytes(zlib.decompress(base64.b64decode(src.read_text().strip())))
          PY
          cp "$GITHUB_WORKSPACE/.r27-src/README.txt" SafeUpdate2026/README.txt
          cp "$GITHUB_WORKSPACE/.r27-src/__init__.py" SafeUpdate2026/__init__.py

          test "$(sha256sum SafeUpdate2026/plugin.py | awk '{print $1}')" = "ac3416403e54d4913a5e535303fe3824c7f6b6637798abfe9b29f41df090e7d7"
          test "$(sha256sum SafeUpdate2026/README.txt | awk '{print $1}')" = "66f7873cae67527702dba3125f9cf2243343a9dfc497d549a5803e710327dafb"
          test "$(sha256sum SafeUpdate2026/__init__.py | awk '{print $1}')" = "8b084a9f378124b2b1a51563bf3c22444eb7ff33692017da28b2136ae56987ed"

          rm -f "$GITHUB_WORKSPACE/SafeUpdate2026_2026.1-r27.zip"
          zip -q -r "$GITHUB_WORKSPACE/SafeUpdate2026_2026.1-r27.zip" SafeUpdate2026

      - name: Commit ZIP and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SafeUpdate2026_2026.1-r27.zip
          git rm -r .r27-src .github/workflows/build-r27.yml
          git commit -m "Add SafeUpdate2026 2026.1-r27 ZIP"
          git push origin HEAD:main
