name: Build SafeUpdate2026 r30 ZIP

on:
  push:
    branches: [main]
    paths:
      - '.r30-build-trigger'

permissions:
  contents: write

jobs:
  build-r30:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and verify r30
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/r30build
          mkdir -p /tmp/r30build
          unzip -q SafeUpdate2026_2026.1-r29.zip -d /tmp/r30build
          python3 -c 'from pathlib import Path; p=Path(".r30-src/patch_r30.py"); s=p.read_text(); s=s.replace("pat.subn(repl, s, count=1)", "pat.subn(lambda m: repl, s, count=1)"); s=s.replace("script_pat.subn(script_repl, s, count=1)", "script_pat.subn(lambda m: script_repl, s, count=1)"); s=s.replace("rollback_pat.subn(rollback_repl, s, count=1)", "rollback_pat.subn(lambda m: rollback_repl, s, count=1)"); s=s.replace("delete_pat.subn(delete_repl, s, count=1)", "delete_pat.subn(lambda m: delete_repl, s, count=1)"); p.write_text(s)'
          python3 .r30-src/patch_r30.py /tmp/r30build/SafeUpdate2026/plugin.py
          python3 -m py_compile /tmp/r30build/SafeUpdate2026/plugin.py
          printf '%s\n' \
            'SafeUpdate2026 2026.1-r30' \
            '=========================' \
            '' \
            'GigaBlue UHD Trio 4K: native Slot-/Kernel-Unterstuetzung.' \
            'Interne Slots 1-4: linuxrootfs1-4 auf /dev/mmcblk0p16.' \
            'Kernel: Slot1=p12, Slot2=p13, Slot3=p14, Slot4=p15.' \
            'USB STARTUP_5/6 werden nicht als Backup-Ziele verwendet.' \
            'Rootfs und separater Kernel werden beim Backup verifiziert.' \
            'Kernel-HOLDs nutzen die getesteten 4.4.35-Pakete.' \
            'VU+/andere Receiver behalten den r29-Pfad.' \
            > /tmp/r30build/SafeUpdate2026/README.txt
          rm -f SafeUpdate2026_2026.1-r30.zip
          cd /tmp/r30build
          zip -q -r "$GITHUB_WORKSPACE/SafeUpdate2026_2026.1-r30.zip" SafeUpdate2026
          cd "$GITHUB_WORKSPACE"
          SHA="$(sha256sum SafeUpdate2026_2026.1-r30.zip | awk '{print $1}')"
          python3 -c 'import json,sys; data={"version":"2026.1-r30","mode":"full","download":"https://raw.githubusercontent.com/keggy6893/SafeUpdate2026/main/SafeUpdate2026_2026.1-r30.zip","sha256":sys.argv[1],"plugin_dir":"/usr/lib/enigma2/python/Plugins/Extensions/SafeUpdate2026"}; open("latest.json","w",encoding="utf-8").write(json.dumps(data,indent=2)+"\n")' "$SHA"

      - name: Publish r30 and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SafeUpdate2026_2026.1-r30.zip latest.json
          git rm -r -f .r30-src .r30-extract-trigger .r30-build-trigger .github/workflows/extract-r29-source.yml .github/workflows/build-r30.yml
          git commit -m "Add SafeUpdate2026 2026.1-r30 GigaBlue Trio 4K support"
          git push origin HEAD:main
