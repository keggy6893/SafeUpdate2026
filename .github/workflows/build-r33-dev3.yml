name: Build SafeUpdate2026 r33 dev3

on:
  push:
    branches: [r33-dev]
    paths:
      - '.r33-dev3/build-trigger'

permissions:
  contents: write

jobs:
  build-r33-dev3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and verify r33 dev3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/r33dev3
          mkdir -p /tmp/r33dev3
          unzip -q SafeUpdate2026_2026.1-r33-dev2.zip -d /tmp/r33dev3
          python3 .r33-dev3/patch_dev3.py /tmp/r33dev3/SafeUpdate2026/plugin.py
          python3 -m py_compile /tmp/r33dev3/SafeUpdate2026/plugin.py
          rm -rf /tmp/r33dev3/SafeUpdate2026/__pycache__
          find /tmp/r33dev3/SafeUpdate2026 -name '*.pyc' -delete 2>/dev/null || true

          python3 - <<'PY'
          import ast, pathlib, time
          p = pathlib.Path('/tmp/r33dev3/SafeUpdate2026/plugin.py')
          s = p.read_text(encoding='utf-8')
          tree = ast.parse(s)
          funcs = {n.name: n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef)}
          classes = {n.name for n in ast.walk(tree) if isinstance(n, ast.ClassDef)}

          required = {
              'rotation_layout_supported', 'rotation_layout_name', 'rotation_status_text',
              '_rotation_seed', 'ensure_rotation_state', 'physically_verified_rotation_state',
              'persist_rotation_state', 'post_update_rotation_delay', 'rotation_sessionstart',
              'get_rotation_service', 'validate_internal_backup_state', 'discover_internal_backups',
              'start_internal_backup', 'restore_internal_backup', 'gigablue_kernel_layout_ok',
              'expected_kernel_device', 'paint_update_state', 'start_update'
          }
          missing = sorted(required - set(funcs))
          if missing:
              raise SystemExit('missing functions: %s' % ', '.join(missing))
          if 'SafeUpdateRotationService' not in classes:
              raise SystemExit('SafeUpdateRotationService missing')

          markers = [
              'PLUGIN_VERSION = "2026.1-r33-dev3"',
              'def rotation_layout_supported():',
              'Auto-Rotation NICHT VERFÜGBAR',
              'enabled = bool(enabled and rotation_layout_supported())',
              'Auto-Rotation sicher deaktiviert: Box-/Slot-Layout nicht freigegeben.',
              'session is not None and rotation_layout_supported()',
              'Normales Backup, Update, Killswitch und Rollback bleiben verfügbar.',
              'UPDATE GESPERRT – BACKUP LÄUFT',
              'ROTATION_VERIFIED',
              'KILLSWITCH blockiert',
              '9 = WIEDERHERSTELLEN',
              're.match(r"^STARTUP_(\\d+)$", base)',
          ]
          for marker in markers:
              if marker not in s:
                  raise SystemExit('missing safety marker: %r' % marker)

          # Execute the pure gate function with mocked identities.
          gate = funcs['rotation_layout_supported']
          code = compile(ast.Module(body=[gate], type_ignores=[]), '<gate>', 'exec')
          ns = {'_USE_CLASSIC_VU_DUO4KSE': True, 'is_gbtrio4k': lambda: False}
          exec(code, ns)
          assert ns['rotation_layout_supported']() is True
          ns = {'_USE_CLASSIC_VU_DUO4KSE': False, 'is_gbtrio4k': lambda: True}
          exec(code, ns)
          assert ns['rotation_layout_supported']() is True
          ns = {'_USE_CLASSIC_VU_DUO4KSE': False, 'is_gbtrio4k': lambda: False}
          exec(code, ns)
          assert ns['rotation_layout_supported']() is False

          # Seed must forcibly disable automatic rotation when the gate is false.
          seed = funcs['_rotation_seed']
          code = compile(ast.Module(body=[seed], type_ignores=[]), '<seed>', 'exec')
          ns = {
              'time': time,
              'current_system_fingerprint': lambda: 'fp',
              'rotation_layout_supported': lambda: False,
              'ROTATION_INTERVAL': 86400,
          }
          exec(code, ns)
          out = ns['_rotation_seed']({'verified': True}, True, 'fp', 100)
          assert out['rotation_enabled'] is False
          assert out['rotation_next_due'] == 0

          # Supported layout keeps normal 24h behavior.
          ns['rotation_layout_supported'] = lambda: True
          out = ns['_rotation_seed']({'verified': True}, True, 'fp', 100)
          assert out['rotation_enabled'] is True
          assert out['rotation_next_due'] == 86500

          # ensure_rotation_state must turn a stale dev2 ON state off on unknown hardware.
          ensure = funcs['ensure_rotation_state']
          code = compile(ast.Module(body=[ensure], type_ignores=[]), '<ensure>', 'exec')
          saved=[]
          ns = {
              'rotation_layout_supported': lambda: False,
              'persist_rotation_state': lambda x: saved.append(dict(x)) or True,
              '_rotation_seed': lambda *a, **k: None,
              'current_system_fingerprint': lambda: 'fp',
              'ROTATION_INTERVAL': 86400,
              'time': time,
          }
          exec(code, ns)
          out = ns['ensure_rotation_state']({'verified': True, 'rotation_enabled': True, 'rotation_next_due': 999})
          assert out['rotation_enabled'] is False
          assert out['rotation_next_due'] == 0
          assert saved and saved[-1]['rotation_enabled'] is False

          # Worker gate must occur before physical state discovery/writes.
          cls = next(n for n in ast.walk(tree) if isinstance(n, ast.ClassDef) and n.name == 'SafeUpdateRotationService')
          check = next(n for n in cls.body if isinstance(n, ast.FunctionDef) and n.name == 'check')
          csrc = ast.get_source_segment(s, check)
          if csrc.index('if not rotation_layout_supported():') > csrc.index('state = physically_verified_rotation_state()'):
              raise SystemExit('worker architecture gate is too late')

          # UI keys must fail closed before state lookup.
          screen = next(n for n in ast.walk(tree) if isinstance(n, ast.ClassDef) and n.name == 'SafeUpdateScreen')
          for name in ('toggle_rotation', 'force_rotation_now'):
              fn = next(n for n in screen.body if isinstance(n, ast.FunctionDef) and n.name == name)
              src = ast.get_source_segment(s, fn)
              if src.index('if not rotation_layout_supported():') > src.index('state = physically_verified_rotation_state()'):
                  raise SystemExit('%s gate is too late' % name)

          print('r33-dev3 fail-closed gate tests: OK')
          PY

          cat > /tmp/r33dev3/SafeUpdate2026/README.txt <<'EOF'
          SafeUpdate2026 2026.1-r33-dev3
          ==============================

          Sicherer r33-Releasekandidat auf Basis des hardwarebestaetigten VU+-dev2.

          Neu in dev3:
          - Auto-Rotation ist fail-closed und nur auf explizit freigegebenen Layouts aktiv.
          - Freigegeben: VU+ Duo 4K SE und GigaBlue UHD Trio 4K.
          - Unbekannte/andere Boxen: Auto-Rotation und Taste 7/8 sind sicher deaktiviert.
          - Normales Backup, Update, Killswitch und Rollback bleiben auf solchen Boxen unveraendert verfuegbar.
          - Auf nicht freigegebenen Boxen wird kein Auto-Rotations-Hintergrundtimer gestartet.
          - Alte dev1/dev2 Rotationszustaende werden auf unbekannten Boxen automatisch auf AUS gesetzt.
          - SF8008 bleibt bis zum separaten Hardwaretest von r33-Auto-Rotation ausgeschlossen.

          Beibehalten:
          - roter technischer Update-Lock waehrend Backup/Rotation/Loeschen/Wiederherstellung
          - 24h-Pruefung, Fingerprint-Skip und sichere Backup-Rotation auf freigegebenen Layouts
          - internes eMMC-Fallback, GigaBlue Kernel-Schutz, Killswitch 0 und Notfall-Restore 9
          EOF
          sed -i 's/^          //' /tmp/r33dev3/SafeUpdate2026/README.txt

          rm -f SafeUpdate2026_2026.1-r33-dev3.zip
          cd /tmp/r33dev3
          zip -q -r "$GITHUB_WORKSPACE/SafeUpdate2026_2026.1-r33-dev3.zip" SafeUpdate2026
          cd "$GITHUB_WORKSPACE"
          SHA="$(sha256sum SafeUpdate2026_2026.1-r33-dev3.zip | awk '{print $1}')"
          echo "$SHA  SafeUpdate2026_2026.1-r33-dev3.zip" > r33-dev-sha256.txt
          python3 -c 'import json,sys; data={"version":"2026.1-r33-dev3","mode":"full","download":"https://raw.githubusercontent.com/keggy6893/SafeUpdate2026/r33-dev/SafeUpdate2026_2026.1-r33-dev3.zip","sha256":sys.argv[1],"plugin_dir":"/usr/lib/enigma2/python/Plugins/Extensions/SafeUpdate2026"}; open("latest-r33-test.json","w",encoding="utf-8").write(json.dumps(data,indent=2)+"\n")' "$SHA"

      - name: Publish r33 dev3 on test branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SafeUpdate2026_2026.1-r33-dev3.zip latest-r33-test.json r33-dev-sha256.txt
          git commit -m 'Publish r33 dev3 fail-closed rotation gate'
          git push origin HEAD:r33-dev
