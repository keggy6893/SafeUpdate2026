name: Inspect r33 recovery state

on:
  push:
    branches: [r34-dev]
    paths:
      - '.r34-inspect-trigger'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect r33 state and backup metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/r34inspect
          mkdir -p /tmp/r34inspect
          unzip -q SafeUpdate2026_2026.1-r33.zip -d /tmp/r34inspect
          P=/tmp/r34inspect/SafeUpdate2026/plugin.py
          python3 - "$P" > .r34-state-inspect.txt <<'PY'
          import ast, re, sys
          from pathlib import Path
          p=Path(sys.argv[1])
          s=p.read_text(encoding='utf-8')
          print("PLUGIN VERSION")
          for line in s.splitlines():
              if "PLUGIN_VERSION" in line:
                  print(line)
                  break
          print("\nSTRING PATHS / STATE KEYS")
          pats=[
              r'[^\n]{0,100}(?:state|backup|rotation)[^\n]{0,140}',
              r'[^\n]{0,100}(?:/etc|/var|/tmp|/media)[^\n]{0,140}',
          ]
          seen=set()
          for pat in pats:
              for m in re.finditer(pat,s,re.I):
                  line=m.group(0).strip()
                  if line and line not in seen:
                      seen.add(line); print(line)
          print("\nFUNCTIONS OF INTEREST")
          tree=ast.parse(s)
          names=[
            'load_state','save_state','state_load','state_save','read_state','write_state',
            'active_slot','current_slot','free_slots','slot_root','slot_root_path',
            'physically_verify_backup','validate_backup','validate_internal_backup_state',
            'discover_internal_backups','read_startup_entries','parse_startup_entry',
            'expected_kernel_device','restore_internal_backup','do_restore_internal_backup'
          ]
          for n in ast.walk(tree):
              if isinstance(n, ast.FunctionDef) and (n.name in names or any(x in n.name.lower() for x in ['state','slot','backup','startup','update','ok'])):
                  seg=ast.get_source_segment(s,n)
                  if seg and len(seg) < 10000:
                      print("\n###",n.name)
                      print(seg)
          PY

      - name: Publish inspection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .r34-state-inspect.txt
          git diff --cached --quiet || {
            git commit -m "Inspect r33 recovery state metadata"
            git push origin HEAD:r34-dev
          }
