name: Inspect r33 UI

on:
  push:
    branches: [r33-dev]
    paths:
      - '.inspect-r33-trigger'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract UI snippets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/r33inspect
          mkdir -p /tmp/r33inspect
          unzip -q SafeUpdate2026_2026.1-r33-dev1.zip -d /tmp/r33inspect
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/r33inspect/SafeUpdate2026/plugin.py')
          lines = p.read_text(encoding='utf-8').splitlines()
          needles = [
              'OPENATV UPDATE STARTEN', 'Backup verifiziert', 'updateButton', 'update_button',
              'start_update', 'startUpdate', 'do_update', 'keyGreen', 'green',
              'ROTATION_VERIFIED', 'force_rotation_now', 'toggle_rotation',
              'Auto-Rotation', 'Backup-Fortschritt', 'backupProgress', 'progress'
          ]
          out=[]
          seen=set()
          for i,line in enumerate(lines):
              if any(n.lower() in line.lower() for n in needles):
                  a=max(0,i-12); b=min(len(lines),i+25)
                  key=(a,b)
                  if key in seen: continue
                  seen.add(key)
                  out.append('\n===== lines %d-%d =====\n' % (a+1,b))
                  out.extend('%5d: %s' % (j+1, lines[j]) for j in range(a,b))
          Path('.r33-ui-snippets.txt').write_text('\n'.join(out)+'\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .r33-ui-snippets.txt
          git commit -m 'Capture r33 UI code snippets' || true
          git push origin HEAD:r33-dev
