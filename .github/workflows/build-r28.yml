name: Build SafeUpdate2026 r28 ZIP

on:
  push:
    branches: [main]
    paths:
      - '.r28-src/TRIGGER'

permissions:
  contents: write

jobs:
  build-r28:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and verify r28
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/r28build
          mkdir -p /tmp/r28build
          cp SafeUpdate2026_2026.1-r27.zip /tmp/r28build/r27.zip
          cd /tmp/r28build
          unzip -q r27.zip

          python3 - <<'PY'
          from pathlib import Path
          p = Path('SafeUpdate2026/plugin.py')
          s = p.read_text(encoding='utf-8')
          old_version = 'PLUGIN_VERSION = "2026.1-r27"'
          old_screen = '<screen name="SafeUpdateScreen" position="0,0" size="1920,1080" flags="wfNoBorder" backgroundColor="#000b14">'
          new_screen = '<screen name="SafeUpdateScreen" position="0,0" size="1920,1080" resolution="1920,1080" flags="wfNoBorder" backgroundColor="#000b14">'
          if s.count(old_version) != 1:
              raise SystemExit('unexpected r27 version marker count: %d' % s.count(old_version))
          if s.count(old_screen) != 1:
              raise SystemExit('unexpected SafeUpdateScreen marker count: %d' % s.count(old_screen))
          s = s.replace(old_version, 'PLUGIN_VERSION = "2026.1-r28"', 1)
          s = s.replace(old_screen, new_screen, 1)
          p.write_text(s, encoding='utf-8')
          compile(p.read_bytes(), str(p), 'exec')
          Path('SafeUpdate2026/README.txt').write_text('''SafeUpdate2026 2026.1-r28
==========================

r28 - Full-HD/OpenATV scaling fix
--------------------------------
- SafeUpdateScreen declares resolution="1920,1080" explicitly.
- Prevents OpenATV from scaling the already-Full-HD 1920x1080 layout a second time by 1.5x.
- Fixes clipped right and bottom areas seen on the GigaBlue test box.
- Receiver detection and neutral GigaBlue artwork remain unchanged.
- Backup, KEXEC, kernel-HOLD, slot, rollback and update safety logic are unchanged from r27.

Tester: first open the plugin and verify the complete UI is visible before starting a backup or update.
''', encoding='utf-8')
          PY

          test "$(sha256sum SafeUpdate2026/plugin.py | awk '{print $1}')" = "4f602245c7e9c35e1a34749da43c1706de3e785ff4bb71eb10db22338054e4c8"
          grep -q 'PLUGIN_VERSION = "2026.1-r28"' SafeUpdate2026/plugin.py
          grep -q 'resolution="1920,1080"' SafeUpdate2026/plugin.py
          test -f SafeUpdate2026/background_generic.png
          test -f SafeUpdate2026/background_vu_duo4kse.png
          test -f SafeUpdate2026/__init__.py

          rm -f "$GITHUB_WORKSPACE/SafeUpdate2026_2026.1-r28.zip"
          zip -q -r "$GITHUB_WORKSPACE/SafeUpdate2026_2026.1-r28.zip" SafeUpdate2026
          SHA="$(sha256sum "$GITHUB_WORKSPACE/SafeUpdate2026_2026.1-r28.zip" | awk '{print $1}')"
          cat > "$GITHUB_WORKSPACE/latest.json" <<EOF
          {
            "version": "2026.1-r28",
            "mode": "full",
            "download": "https://raw.githubusercontent.com/keggy6893/SafeUpdate2026/main/SafeUpdate2026_2026.1-r28.zip",
            "sha256": "$SHA",
            "plugin_dir": "/usr/lib/enigma2/python/Plugins/Extensions/SafeUpdate2026"
          }
          EOF
          echo "r28 sha256=$SHA"

      - name: Publish r28 and clean staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SafeUpdate2026_2026.1-r28.zip latest.json
          git rm -r .r28-src .github/workflows/build-r28.yml
          git commit -m "Add SafeUpdate2026 2026.1-r28 scaling fix"
          git push origin HEAD:main
